experience:
  - role: DevOps Engineer / Site Reliability Engineer
    org: NHN Cloud
    start: 2020-07-01
    end: 2025-07-31
    button:
      url: https://www.nhncloud.com/
      text: nhncloud.com
    summary: |
      Company-wide DevOps platform for NHN Cloud PaaS, a top-3 cloud provider in South Korea.

      - Built and operated 16 Kubernetes clusters (130+ nodes, 4,000+ pods) across public, air-gapped government, and DR environments, with CI/CD pipelines serving 30+ internal PaaS teams using ArgoCD, Jenkins, Keycloak, and Harbor
      - Reduced deployment time by over 83% by redesigning GitOps delivery with ArgoCD's App of Apps pattern and ApplicationSet
      - Migrated 10 legacy products to Kubernetes across 6 regions with zero production incidents, leading containerization, Helm chart standardization, and automated certificate management
      - Owned production operations for the 10 migrated products and 39 company-wide API gateway servers on CentOS Linux, leading deployments, upgrades, and 24/7 on-call incident response
      - Raised Loki log ingestion throughput 52% and cut write failures 74% by benchmarking with k6 load tests and tuning chunk encoding and ingestion rate limits
      - Standardized cross-region disaster recovery with GSLB-based failover and auto-scaling, and cut maintenance toil by automating node operations with Ansible playbooks
      - Automated disk-pressure cleanup across 10 cluster environments with threshold-based shell scripts rolled out via Ansible, eliminating recurring manual intervention
      - Led a certificate-automation PoC with DigiCert's US headquarters, cutting costs 20% (2023 Employee of the Year)
      - Established platform governance for 30+ teams, defining deployment permission and resource tagging policies and authoring company-wide standard Helm chart templates, including csi-s3 storage integration charts
      - Validated OpenTelemetry adoption through hands-on testing and authored internal adoption guides
      - Improved ArgoCD notifications with granular sync/deploy/status alerts and de-duplication, reducing alert noise for on-call engineers
      - Built proactive Kubernetes cluster health checks verifying connectivity from AWS, DR, and internal networks
      - Upgraded the company-wide API gateway fleet ahead of CentOS 6 end-of-life, including Apache upgrades
      - Configured graceful-shutdown behavior for Kubernetes workloads during the legacy migration
      - Served as main SPOC for key enterprise customers and standardized support response templates with the NHN Enterprise team
      - Authored partner training materials and hands-on labs for NHN Cloud products (Notification, Deploy, Log & Crash, CDN, Image) and the Kubernetes onboarding guide (CI/CD, Helm, logging, monitoring)
